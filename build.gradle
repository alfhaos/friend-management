plugins {
    id 'java'
    id 'checkstyle'
    id 'org.springframework.boot' version '3.5.9'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.apr'
version = '0.0.1-SNAPSHOT'
description = 'apr-backend-assignment'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {

    // JPA
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    // 테스트 코드용 Lombok
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    // PostgreSQL
    runtimeOnly 'org.postgresql:postgresql'

    // redis
    implementation 'org.redisson:redisson-spring-boot-starter:3.23.5'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // LogBack 위해 추가
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // swagger
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.15"

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.testcontainers:postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    // DB/Redis cleanup is scoped to one test at a time.
    maxParallelForks = 1
}

// Development data generation is compiled and run only when explicitly requested.
sourceSets {
    sampleData {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    sampleDataImplementation.extendsFrom implementation
    sampleDataRuntimeOnly.extendsFrom runtimeOnly
}

tasks.register('seedSampleData', JavaExec) {
    group = 'application'
    description = 'Insert development sample data into the configured database (explicit opt-in).'
    classpath = sourceSets.sampleData.runtimeClasspath
    mainClass = 'com.apr.aprbackendassignment.sampledata.SampleDataInsert'
}

checkstyle {
    toolVersion = '10.26.1'
    configFile = file('config/checkstyle/checkstyle.xml')
    maxWarnings = 0
}

tasks.withType(Checkstyle).configureEach {
    reports {
        xml.required = true
        html.required = true
    }
}

// Keep a narrow, executable baseline while the review sequence improves the model.
// Include the opt-in generator so moving code out of test never bypasses lint.
tasks.register('lint') {
    group = 'verification'
    description = 'Check Java syntax, safe logging, and source hygiene in every source set.'
    dependsOn tasks.withType(Checkstyle)
}
