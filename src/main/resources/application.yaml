server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:./H2/apr;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: root
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
logging:
  level:
    root: INFO

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

  api-docs:
    path: /v3/api-docs

  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  packages-to-scan:
    - com.apr.aprbackendassignment.controller

